<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HireNovaX - AI Career Platform</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0052CC;
            --primary-dark: #003399;
            --secondary: #7C3AED;
            --accent: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --gray-50: #F9FAFB;
            --gray-100: #F3F4F6;
            --gray-200: #E5E7EB;
            --gray-300: #D1D5DB;
            --gray-400: #9CA3AF;
            --gray-500: #6B7280;
            --gray-600: #4B5563;
            --gray-700: #374151;
            --gray-800: #1F2937;
            --gray-900: #111827;
            --text-primary: var(--gray-900);
            --text-secondary: var(--gray-600);
            --bg-primary: #FFFFFF;
            --bg-secondary: var(--gray-50);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            color: var(--text-primary);
            background: var(--bg-secondary);
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 240px;
            background: var(--bg-primary);
            border-right: 1px solid var(--gray-200);
            padding: 20px;
            overflow-y: auto;
        }

        .sidebar-header {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 30px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding: 12px;
            background: var(--gray-50);
            border-radius: 8px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            margin-right: 12px;
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            font-weight: 600;
            font-size: 13px;
        }

        .user-status {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .ai-coach-btn {
            width: 100%;
            padding: 10px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .ai-coach-btn:hover {
            background: var(--primary-dark);
        }

        .nav-section {
            margin-bottom: 30px;
        }

        .nav-item {
            padding: 10px 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
        }

        .nav-item:hover {
            background: var(--gray-50);
            color: var(--text-primary);
        }

        .nav-item.active {
            background: var(--gray-100);
            color: var(--primary);
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: var(--bg-primary);
            border-bottom: 1px solid var(--gray-200);
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-search {
            flex: 1;
            max-width: 400px;
            position: relative;
        }

        .header-search input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--gray-200);
            border-radius: 6px;
            font-size: 13px;
        }

        .header-actions {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .header-icon {
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 18px;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
        }

        .page-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .page-subtitle {
            color: var(--text-secondary);
            margin-bottom: 24px;
            font-size: 14px;
        }

        .card {
            background: var(--bg-primary);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--gray-200);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-primary {
            background: #DDD6FE;
            color: #4F46E5;
        }

        .badge-success {
            background: #D1FAE5;
            color: #059669;
        }

        .badge-warning {
            background: #FEF3C7;
            color: #D97706;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: var(--gray-50);
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .course-card {
            background: var(--bg-primary);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--gray-200);
            transition: transform 0.2s;
        }

        .course-card:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
        }

        .course-image {
            width: 100%;
            height: 140px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 40px;
        }

        .course-content {
            padding: 16px;
        }

        .course-title {
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .course-instructor {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .course-rating {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--gray-200);
            border-radius: 2px;
            margin: 8px 0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            transition: width 0.3s;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            background: var(--gray-100);
            color: var(--text-primary);
            border: 1px solid var(--gray-200);
        }

        .btn-secondary:hover {
            background: var(--gray-200);
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .table thead {
            background: var(--gray-50);
            border-bottom: 1px solid var(--gray-200);
        }

        .table th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .table td {
            padding: 12px;
            border-bottom: 1px solid var(--gray-200);
        }

        .table tbody tr:hover {
            background: var(--gray-50);
        }

        .job-card {
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
            transition: all 0.2s;
        }

        .job-card:hover {
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(0, 82, 204, 0.1);
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 12px;
        }

        .job-title {
            font-size: 16px;
            font-weight: 600;
        }

        .job-company {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .job-match {
            display: inline-block;
            background: #DDD6FE;
            color: #4F46E5;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .job-meta {
            display: flex;
            gap: 20px;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .job-skills {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .skill-tag {
            background: var(--gray-100);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            color: var(--text-primary);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
        }

        .modal-header {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
        }

        .form-input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--gray-200);
            border-radius: 6px;
            font-size: 13px;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 82, 204, 0.1);
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
        }

        .spinner {
            border: 3px solid var(--gray-200);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .chart-container {
            height: 300px;
            background: var(--gray-50);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            gap: 12px;
        }

        .chart-bar {
            flex: 1;
            background: var(--primary);
            border-radius: 4px 4px 0 0;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 12px;
            position: relative;
        }

        .notification {
            background: var(--bg-primary);
            border-left: 4px solid var(--accent);
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 4px;
            border: 1px solid var(--gray-200);
        }

        .notification-title {
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 13px;
        }

        .notification-text {
            font-size: 12px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const API_URL = 'http://localhost:5000/api';

        // Main App Component
        function App() {
            const [currentPage, setCurrentPage] = React.useState('dashboard');
            const [user, setUser] = React.useState(null);
            const [loading, setLoading] = React.useState(true);

            React.useEffect(() => {
                // Simulate loading user data
                setTimeout(() => {
                    setUser({
                        id: 1,
                        name: 'Alex Sterling',
                        email: 'alex@hirenova.com',
                        avatar: 'AS',
                        careerPath: 'AI Career Path: Active'
                    });
                    setLoading(false);
                }, 500);
            }, []);

            if (loading) {
                return <div className="loading"><div className="spinner"></div></div>;
            }

            return (
                <div className="container">
                    <Sidebar currentPage={currentPage} onPageChange={setCurrentPage} user={user} />
                    <div className="main">
                        <Header user={user} />
                        <div className="content">
                            {currentPage === 'dashboard' && <Dashboard user={user} />}
                            {currentPage === 'learning' && <LearningPage />}
                            {currentPage === 'jobs' && <JobsPage />}
                            {currentPage === 'insights' && <InsightsPage />}
                            {currentPage === 'applications' && <ApplicationsPage />}
                        </div>
                    </div>
                </div>
            );
        }

        function Sidebar({ currentPage, onPageChange, user }) {
            const navItems = [
                { id: 'dashboard', label: 'Dashboard', icon: '📊' },
                { id: 'learning', label: 'My Learning', icon: '🎓' },
                { id: 'jobs', label: 'Jobs', icon: '💼' },
                { id: 'applications', label: 'Applications', icon: '📋' },
                { id: 'insights', label: 'Market Insights', icon: '📈' },
            ];

            return (
                <div className="sidebar">
                    <div className="sidebar-header">HireNova X</div>
                    
                    <div className="user-profile">
                        <div className="user-avatar">{user.avatar}</div>
                        <div className="user-info">
                            <div className="user-name">{user.name}</div>
                            <div className="user-status">{user.careerPath}</div>
                        </div>
                    </div>

                    <button className="ai-coach-btn">⚡ Ask AI Coach</button>

                    <div className="nav-section">
                        {navItems.map(item => (
                            <div 
                                key={item.id}
                                className={`nav-item ${currentPage === item.id ? 'active' : ''}`}
                                onClick={() => onPageChange(item.id)}
                            >
                                <span>{item.icon}</span>
                                <span>{item.label}</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function Header({ user }) {
            return (
                <div className="header">
                    <input type="text" placeholder="Search courses, skills..." className="header-search" />
                    <div className="header-actions">
                        <span className="header-icon">🔔</span>
                        <div className="user-avatar" style={{ marginBottom: 0, width: 36, height: 36 }}>
                            {user.avatar}
                        </div>
                    </div>
                </div>
            );
        }

        function Dashboard({ user }) {
            const [stats, setStats] = React.useState(null);
            const [courses, setCourses] = React.useState([]);

            React.useEffect(() => {
                // Simulate API call
                setStats({
                    careerReadiness: 84,
                    skillProgress: 65,
                    learningStreak: 12,
                    resumeScore: 92
                });

                setCourses([
                    {
                        id: 1,
                        title: 'Advanced LLM Orchestration',
                        instructor: 'Dr. Sarah Chen',
                        rating: 4.9,
                        progress: 0,
                        duration: '18h 45m',
                        level: 'Intermediate',
                        match: '94%',
                        thumbnail: '🤖'
                    },
                    {
                        id: 2,
                        title: 'Generative AI for Developers',
                        instructor: 'James Wilson',
                        rating: 4.8,
                        progress: 62,
                        duration: '12h 20m',
                        level: 'Advanced',
                        match: '99%',
                        thumbnail: '🧠'
                    },
                    {
                        id: 3,
                        title: 'Mastering Design Systems',
                        instructor: 'Elena Rodriguez',
                        rating: 4.7,
                        progress: 12,
                        duration: '24h 00m',
                        level: 'Beginner',
                        match: '88%',
                        thumbnail: '🎨'
                    }
                ]);
            }, []);

            if (!stats) {
                return <div className="loading"><div className="spinner"></div></div>;
            }

            return (
                <>
                    <h1 className="page-title">Welcome back, {user.name.split(' ')[0]}! 👋</h1>
                    <p className="page-subtitle">Your AI Career Coach has analyzed 4 new job matches and suggested a skill upgrade to increase your hireability by 12%.</p>

                    <div className="stats-grid">
                        <div className="stat-box">
                            <div className="stat-value">{stats.careerReadiness}%</div>
                            <div className="stat-label">Career Readiness Score</div>
                        </div>
                        <div className="stat-box" style={{ borderLeftColor: '#10B981' }}>
                            <div className="stat-value" style={{ color: '#10B981' }}>+15% 📈</div>
                            <div className="stat-label">Skill Progress This Week</div>
                        </div>
                        <div className="stat-box" style={{ borderLeftColor: '#F59E0B' }}>
                            <div className="stat-value" style={{ color: '#F59E0B' }}>{stats.learningStreak}</div>
                            <div className="stat-label">Day Learning Streak 🔥</div>
                        </div>
                        <div className="stat-box" style={{ borderLeftColor: '#8B5CF6' }}>
                            <div className="stat-value" style={{ color: '#8B5CF6' }}>{stats.resumeScore}</div>
                            <div className="stat-label">Resume ATS Score</div>
                        </div>
                    </div>

                    <div className="card">
                        <div className="card-header">
                            <h3 className="card-title">Recommended Courses for You</h3>
                        </div>
                        <div className="course-grid">
                            {courses.map(course => (
                                <div key={course.id} className="course-card">
                                    <div className="course-image">{course.thumbnail}</div>
                                    <div className="course-content">
                                        <div className="badge badge-primary" style={{ marginBottom: '8px' }}>
                                            {course.match} Match
                                        </div>
                                        <h4 className="course-title">{course.title}</h4>
                                        <p className="course-instructor">{course.instructor}</p>
                                        <div className="course-rating">
                                            ⭐ {course.rating} • {course.duration} • {course.level}
                                        </div>
                                        <div className="progress-bar">
                                            <div className="progress-fill" style={{ width: `${course.progress}%` }}></div>
                                        </div>
                                        <button className="btn btn-primary" style={{ width: '100%' }}>
                                            {course.progress > 0 ? 'Continue' : 'Start'} Course
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="card">
                        <div className="card-header">
                            <h3 className="card-title">Skill Assessments</h3>
                            <a href="#" style={{ color: 'var(--primary)', textDecoration: 'none', fontSize: '13px' }}>View All</a>
                        </div>
                        <table className="table">
                            <thead>
                                <tr>
                                    <th>Assessment</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>
                                        <div>🐍 Python Data Science Proficiency</div>
                                        <small style={{ color: 'var(--text-secondary)' }}>Verified by HireNova AI • 25 Questions</small>
                                    </td>
                                    <td><span className="badge badge-warning">Start Test</span></td>
                                    <td></td>
                                </tr>
                                <tr>
                                    <td>
                                        <div>🏗️ System Design Fundamentals</div>
                                        <small style={{ color: 'var(--text-secondary)' }}>Verified by Google Cloud • 50 Questions</small>
                                    </td>
                                    <td><span className="badge badge-success">Passed ✓</span></td>
                                    <td></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </>
            );
        }

        function LearningPage() {
            return (
                <>
                    <h1 className="page-title">My Learning</h1>
                    <p className="page-subtitle">Track your learning progress and continue where you left off</p>
                    <div className="card">
                        <p style={{ textAlign: 'center', padding: '40px', color: 'var(--text-secondary)' }}>
                            Your active courses and learning paths will appear here
                        </p>
                    </div>
                </>
            );
        }

        function JobsPage() {
            const [jobs, setJobs] = React.useState([]);

            React.useEffect(() => {
                setJobs([
                    {
                        id: 1,
                        title: 'Senior Product Designer',
                        company: 'Sentient AI',
                        location: 'San Francisco, CA',
                        type: 'Remote',
                        salary: '$160k - $220k',
                        posted: '2 hours ago',
                        match: '98%',
                        skills: ['Figma', 'React', 'AI-First UX']
                    },
                    {
                        id: 2,
                        title: 'AI Lead Engineer',
                        company: 'Flux Robotics',
                        location: 'Austin, TX',
                        type: 'Hybrid',
                        salary: '$180k - $250k',
                        posted: '5 hours ago',
                        match: '82%',
                        skills: ['Python', 'PyTorch', 'LLMs']
                    },
                    {
                        id: 3,
                        title: 'Growth Marketing Manager',
                        company: 'Horizon Finance',
                        location: 'Remote',
                        type: 'Remote',
                        salary: '$120k - $150k',
                        posted: '1 day ago',
                        match: '75%',
                        skills: ['SEO/SEM', 'Analytics']
                    }
                ]);
            }, []);

            return (
                <>
                    <h1 className="page-title">Recommended for You</h1>
                    <p className="page-subtitle">142 jobs found</p>

                    <div className="card">
                        <div className="card-title" style={{ marginBottom: '16px' }}>Filters</div>
                        <div style={{ marginBottom: '16px' }}>
                            <label className="form-label">Salary Range (Annual, USD)</label>
                            <input type="range" min="40" max="300" style={{ width: '100%' }} />
                            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '12px', color: 'var(--text-secondary)' }}>
                                <span>$40k</span>
                                <span>$300k+</span>
                            </div>
                        </div>
                        <div style={{ marginBottom: '16px' }}>
                            <label className="form-label">Work Model</label>
                            <div style={{ display: 'flex', gap: '8px' }}>
                                <button className="btn btn-primary" style={{ flex: 1, fontSize: '12px' }}>Remote</button>
                                <button className="btn btn-secondary" style={{ flex: 1, fontSize: '12px' }}>Hybrid</button>
                                <button className="btn btn-secondary" style={{ flex: 1, fontSize: '12px' }}>On-site</button>
                            </div>
                        </div>
                    </div>

                    {jobs.map(job => (
                        <div key={job.id} className="job-card">
                            <div className="job-header">
                                <div>
                                    <div className="job-title">{job.title}</div>
                                    <div className="job-company">{job.company} • {job.location} • {job.type}</div>
                                </div>
                                <div className="job-match">{job.match} Match</div>
                            </div>
                            <div className="job-meta">
                                <span>💰 {job.salary}</span>
                                <span>🕐 {job.posted}</span>
                            </div>
                            <div className="job-skills">
                                {job.skills.map((skill, idx) => (
                                    <span key={idx} className="skill-tag">{skill}</span>
                                ))}
                            </div>
                            <div style={{ display: 'flex', gap: '12px' }}>
                                <button className="btn btn-primary">Quick Apply</button>
                                <button className="btn btn-secondary">View Details</button>
                            </div>
                        </div>
                    ))}
                </>
            );
        }

        function InsightsPage() {
            return (
                <>
                    <h1 className="page-title">Market Insights & Salary Analytics</h1>
                    <p className="page-subtitle">Leveraging real-time AI processing to decode hiring trends, salary benchmarks, and the rapidly evolving skills landscape of the global tech economy.</p>

                    <div className="card">
                        <div className="card-header">
                            <h3 className="card-title">Average Salary by Role</h3>
                        </div>
                        <div className="chart-container">
                            <div className="chart-bar" style={{ height: '85%' }}>
                                <span>$195k</span>
                            </div>
                            <div className="chart-bar" style={{ height: '78%' }}>
                                <span>$168k</span>
                            </div>
                            <div className="chart-bar" style={{ height: '72%' }}>
                                <span>$153k</span>
                            </div>
                            <div className="chart-bar" style={{ height: '68%' }}>
                                <span>$142k</span>
                            </div>
                            <div className="chart-bar" style={{ height: '65%' }}>
                                <span>$135k</span>
                            </div>
                        </div>
                    </div>

                    <div className="card">
                        <div className="card-header">
                            <h3 className="card-title">Skills in Demand</h3>
                        </div>
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                            {['Generative AI', 'Rust', 'LangChain', 'TypeScript', 'Kubernetes'].map((skill, idx) => (
                                <div key={idx} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                                    <span>{skill}</span>
                                    <span className="badge badge-primary">+{15 + idx}%</span>
                                </div>
                            ))}
                        </div>
                    </div>
                </>
            );
        }

        function ApplicationsPage() {
            const [applications, setApplications] = React.useState([
                { id: 1, company: 'Meta', role: 'Software Intern', status: 'Interviewing', statusBadge: 'warning' },
                { id: 2, company: 'Airbnb', role: 'UI Developer', status: 'Applied', statusBadge: 'primary' },
                { id: 3, company: 'NVIDIA', role: 'CUDA Engineer', status: 'Offer', statusBadge: 'success' }
            ]);

            return (
                <>
                    <h1 className="page-title">Job Applications</h1>
                    <p className="page-subtitle">Track and manage all your job applications</p>

                    <div className="card">
                        <table className="table">
                            <thead>
                                <tr>
                                    <th>Company</th>
                                    <th>Role</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                {applications.map(app => (
                                    <tr key={app.id}>
                                        <td>{app.company}</td>
                                        <td>{app.role}</td>
                                        <td>
                                            <span className={`badge badge-${app.statusBadge}`}>{app.status}</span>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </>
            );
        }

        // Render app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
